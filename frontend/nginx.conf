server {
  listen 80;
  listen [::]:80;   # без этого `localhost` (IPv6 ::1) не отвечает
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 200m;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Docker's embedded DNS. Using a variable in proxy_pass makes nginx resolve the
  # backend hostname at request time instead of at startup: without this, nginx
  # refuses to boot when `backend` is absent ("host not found in upstream") and
  # keeps a stale IP after the backend container is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $kedr_backend http://backend:8000;

  # NOTE: nginx does NOT inherit add_header into a location that declares its own
  # add_header. Every location below therefore repeats the security headers
  # (via the included snippet) instead of relying on inheritance.
  include /etc/nginx/security-headers.conf;

  # --- API ---------------------------------------------------------------
  location /api/ {
    # No URI part -> the original request path (/api/v1/...) is passed through.
    proxy_pass $kedr_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;   # stream large uploads straight through
  }

  # Legacy public uploads path: only used when SERVE_UPLOADS_PUBLIC=true
  location /uploads/ {
    proxy_pass $kedr_backend;
    proxy_set_header X-Forwarded-For $remote_addr;
    include /etc/nginx/security-headers.conf;
  }

  # --- WebSocket alerts ---------------------------------------------------
  location /ws/ {
    proxy_pass $kedr_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # --- Static -------------------------------------------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
}
