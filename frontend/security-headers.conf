# Shared security headers. Included by every location because nginx does not
# inherit add_header into a location that defines its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

# The SPA needs inline styles (Tailwind/framer-motion) and MapLibre workers.
# 'unsafe-inline' for style-src is required by framer-motion's inline styles.
# connect-src allows the OSM/weather tile and API hosts used by the map.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.fr https://tile.openstreetmap.de https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' ws: wss: https://tile.openstreetmap.org https://*.tile.openstreetmap.fr https://tile.openstreetmap.de https://server.arcgisonline.com; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
