name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: python -m pytest -q
      - name: Migrations apply cleanly on a fresh database
        env:
          DATABASE_URL: sqlite:///./ci_fresh.db
          APP_ENV: dev
          SEED_ON_STARTUP: "false"
        run: python -c "from app.models import init_db; init_db()"

  smoke:
    name: API smoke test (real server)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
      DATABASE_URL: sqlite:///./ci.db
      SEED_ON_STARTUP: "true"
      SEED_PASSWORD: kedr-demo-1234
      OVERPASS_TIMEOUT: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Boot the server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8078 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8078/api/v1/health && break
            sleep 1
          done
      - name: Verify every endpoint
        run: python scripts/verify_api.py http://127.0.0.1:8078

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-image:
    name: Backend image builds (multi-arch Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The CPU variant exercises the same Dockerfile logic without pulling ~3.5 GB
      # of CUDA wheels on every push. The auto/cuda branch is verified by the arm64
      # and amd64 builds documented in AUDIT.md.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: TORCH_VARIANT=cpu
          load: true
          tags: kedr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The vision stack must import inside the image
        run: |
          docker run --rm kedr-backend:ci python -c "
          import torch, torchvision, cv2, ultralytics, shapely, psycopg
          print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'cv2', cv2.__version__)"

  compose:
    name: docker-compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose config --quiet
